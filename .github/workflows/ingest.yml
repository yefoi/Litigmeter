name: Ingesta Litigmeter

on:
  schedule:
    # Todos los lunes a las 06:00 UTC: comprueba si hay nota trimestral nueva.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      todas:
        description: "Clasificar todo el histórico descubierto (--todas --force)"
        type: boolean
        default: false
      reclasificar:
        description: "Volver a clasificar aunque ya existan clasificaciones (usa indicadores clave / evidencia nuevos)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ingesta-litigiosidad
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ingesta y clasificación
        run: npm run ingest ${{ github.event_name == 'workflow_dispatch' && inputs.todas && '-- --todas --force' || '' }} ${{ github.event_name == 'workflow_dispatch' && inputs.reclasificar && '--reclasificar' || '' }}
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}

      - name: Indicadores clave
        run: npm run indicadores

      - name: Resumen editorial
        run: npm run editorial
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}

      - name: Commit de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
          else
            git commit -m "data: litigiosidad $(date -u +%Y-%m-%d)"
            git push
          fi
